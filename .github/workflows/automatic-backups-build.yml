name: Build automatic backups APK

on:
  push:
    branches: [build/automatic-backups]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        run: ./gradlew --console=plain :app:assembleGmsRelease
        env:
          METROLIST_APP_NAME: Meld Ali
      - uses: actions/upload-artifact@v6
        with:
          name: automatic-backups-build
          path: app/build/outputs/apk/gms/release/*-unsigned.apk
          if-no-files-found: error
